# .github/dependabot.yml
version: 2
updates:
  # Python (add a requirements.txt or pyproject.toml at repo root first)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions (if/when you add workflows under .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
